[package]
# 복사한 뒤 여기 name과 아래 .env.example / README의 서비스 이름만 바꾸면 된다.
name = "my_server"
version = "0.1.0"
edition = "2024"
# bin이 여러 개일 때 `cargo run`이 어느 것을 실행할지 정해준다. bin을 추가하면
# 이 값을 다시 확인할 것 — 지정이 없으면 `cargo run`이 그냥 실패한다.
default-run = "server"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
# [설명] CancellationToken 하나 때문에 넣는다. 종료 신호를 서버와 백그라운드 태스크가
# 함께 보려면 "여러 곳에서 기다릴 수 있는" 취소 신호가 필요한데, tokio 본체에는 그 타입이
# 없다(watch 채널로 흉내낼 수는 있지만 태스크가 늘수록 장황해진다). tokio 프로젝트가
# 함께 관리하는 부속 크레이트다.
tokio-util = "0.7"
# [설명] 미들웨어는 tower-http의 feature 단위로 켠다. 각각이 무엇을 막는지는
# routes/mod.rs의 레이어 스택 주석 참고.
#   request-id  요청마다 식별자를 부여/전파 (로그 상관관계)
#   timeout     핸들러가 끝나지 않는 요청을 끊는다
#   catch-panic 핸들러 패닉을 500으로 바꾼다 (응답 없이 연결이 끊기지 않게)
#   cors        브라우저에서 직접 부를 때 필요. 기본은 꺼져 있고, routes/mod.rs의
#               주석 처리된 블록을 살리면 켜진다 — feature만 미리 켜 둔 이유는
#               "필요해졌을 때 한 곳만 고치면 되도록"이다.
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "catch-panic", "cors"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# [설명] SQLite를 쓴다. 개인 서버(자원이 넉넉하지 않은 OCI 인스턴스)에 올릴 것이라
# 별도 DB 프로세스를 띄우지 않고 파일 하나로 끝내는 쪽을 택했다.
#
# [주의] postgres feature와 달리 sqlite feature는 **C 코드를 함께 빌드한다**
# (libsqlite3-sys가 SQLite amalgamation을 cc로 컴파일한다). 그래서 크로스 컴파일에
# C 크로스 컴파일러가 필요하다 — Dockerfile이 zig를 쓰는 이유가 이것이다.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# [설명] 스케줄러(scheduler/)가 쓰는 두 크레이트.
#   croner    크론식 파싱과 "다음 발화 시각" 계산만 한다. 태스크를 돌리는 일은 하지 않는다 —
#             그건 tokio + CancellationToken으로 우리가 직접 짠다. 스케줄러 크레이트
#             (tokio-cron-scheduler 등)를 통째로 쓰지 않은 이유가 여기 있다: 그쪽은 자기
#             실행기와 종료 방식을 함께 들고 와서, 이 서비스의 graceful shutdown 흐름과
#             겹친다. "계산"만 빌려 오면 종료·로깅·에러 처리를 기존 규칙 그대로 쓸 수 있다.
#   chrono-tz "매일 새벽 3시"가 어느 시간대인지 정하는 데 쓴다(job마다 지정).
croner = "3"
chrono-tz = "0.10"

# 도메인 에러는 thiserror로 구체 타입(error.rs의 AppError), 최상위는 anyhow로
# 뭉뚱그린다 — 기준은 "호출자가 에러 종류를 구분해야 하는가".
thiserror = "2"
anyhow = "1"

# 포트를 `&dyn Trait`으로 쓰려면 async fn을 박싱해주는 이 매크로가 필요하다.
# (Rust 2024의 async fn in trait은 dyn 호환이 아니다.)
async-trait = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"
# [설명] 레이트 리밋(routes/rate_limit.rs). GCRA 알고리즘으로 IP별 버킷을 관리하고,
# 프록시가 붙여준 x-forwarded-for에서 클라이언트 IP를 뽑는 추출기를 함께 제공한다.
#
# [설명] governor를 직접 넣은 이유는 타입 이름 하나(NoOpMiddleware) 때문이다.
# tower_governor의 GovernorConfig는 미들웨어를 타입 파라미터로 받는데 그 타입을
# 재export하지 않아서, 설정 타입에 별칭을 붙이려면 원본 크레이트가 필요하다.
# 이미 tower_governor의 의존성으로 트리에 들어와 있으므로 버전만 맞췄다.
tower_governor = "0.8"
governor = { version = "0.10", default-features = false, features = ["std", "quanta", "jitter"] }
argon2 = "0.6"
axum-extra = { version = "0.12", features = ["cookie"] }
sha2 = "0.10"
rand = "0.9"
hex = "0.4"
time = "0.3"

[dev-dependencies]
http-body-util = "0.1"
# 포트 trait에서 mock 구현을 컴파일 타임에 생성한다. DB 없이 테스트가 도는 근거.
mockall = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
