# [설명] Cargo.toml(패키지 매니페스트)과는 다른 파일이다. 이쪽은 "cargo라는 도구"
# 자체의 설정이며, 프로젝트 루트의 .cargo/config.toml은 이 디렉토리 아래에서 cargo를
# 실행할 때만 적용된다. 커밋해서 개발 머신/CI/도커 빌드가 같은 조건으로 빌드하게 만든다.

# [설명] [env] 테이블은 cargo가 띄우는 하위 프로세스(rustc, 빌드 스크립트, proc macro)에
# 환경변수를 주입한다. sqlx의 query! 계열 매크로에 설정을 전달할 수 있는 통로가 사실상
# 여기뿐이라 오프라인 설정을 이 파일에 둔다.
[env]
# [핵심] query!/query_as! 매크로는 컴파일 타임에 SQL을 검증하는데, 기본 동작은
# DATABASE_URL로 실제 DB에 접속해 스키마를 물어보는 것이다. 이 값을 켜두면 대신
# 저장소에 커밋된 .sqlx/ 캐시(= cargo sqlx prepare의 산출물)만 보고 검증한다.
#
# 이걸 명시하는 이유가 두 가지다.
#  1) 빌드에서 DB 의존성을 제거한다. 도커 이미지 빌드나 CI처럼 개발용 postgres에
#     접근할 수 없는 환경에서도 컴파일이 성립한다.
#  2) 개발 머신에는 sqlx-cli용 .env가 있어 DATABASE_URL이 잡혀 있다. 이 설정이 없으면
#     매크로가 매번 그 URL로 접속을 시도하므로, DB가 꺼져 있는 날에는 평범한
#     cargo build조차 실패한다.
#
# [주의] 셸 환경변수가 아니라 이 파일에 두는 것이 중요하다. rust-analyzer가 띄우는
# cargo check도 이 설정을 읽으므로, 셸에만 걸면 터미널 빌드는 되는데 에디터에는
# 매크로마다 에러가 뜨는 상태가 된다.
#
# [주의] cargo의 [env]는 force = true가 없으면 이미 설정된 환경변수를 덮어쓰지 않는다.
# cargo sqlx prepare는 내부적으로 SQLX_OFFLINE=false를 세팅한 뒤 cargo를 호출하므로
# 그쪽이 우선하며, 따라서 이 설정이 캐시 갱신을 막지 않는다.
SQLX_OFFLINE = "true"
